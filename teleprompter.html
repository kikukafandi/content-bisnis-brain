<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teleprompter Kikuk</title><style>
:root{color-scheme:dark;--ink:#f4f0e6;--muted:#8c8a84;--acid:#d9ff43;--panel:#151613;--line:#33352e;--size:64px}*{box-sizing:border-box}html,body{margin:0;background:#090a08;color:var(--ink);font-family:"Trebuchet MS",sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(0deg,transparent 0 3px,#fff 4px);z-index:9}.bar{position:fixed;inset:0 0 auto;z-index:10;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:#090a08ed;border-bottom:1px solid var(--line)}button,.file{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 11px;font:700 12px monospace;cursor:pointer}.file,.on{color:var(--acid);border-color:var(--acid)}input[type=file]{display:none}.grow{flex:1}.range{display:flex;align-items:center;gap:5px;color:var(--muted);font:11px monospace}.range input{width:80px;accent-color:var(--acid)}#stage{max-width:980px;margin:auto;padding:45vh 28px 55vh;transform-origin:center top}.mirror{transform:scaleX(-1)}#content{font-size:var(--size);line-height:1.32;font-weight:700}h1,h2,h3{font-family:Georgia,serif;line-height:1.05;color:var(--acid);margin:1.4em 0 .5em}h1{font-size:1.2em}h2,h3{font-size:.78em;text-transform:uppercase}p,li,blockquote{margin:.6em 0}blockquote{padding-left:.65em;border-left:8px solid var(--acid)}table{width:100%;border-collapse:collapse;font-size:.65em}th,td{padding:.45em;border-bottom:2px solid var(--line);text-align:left}.hint{color:var(--muted);font:18px/1.5 monospace;text-align:center}.status{font:12px monospace;color:var(--acid)}.progress{position:fixed;bottom:0;left:0;height:5px;background:var(--acid);z-index:12}.focus{position:fixed;z-index:8;left:0;right:0;top:43%;height:18%;border-block:2px solid #d9ff4355;background:#d9ff4308;pointer-events:none;display:none}.focus.on{display:block}.count{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:#090a08e8;color:var(--acid);font:900 30vw Georgia}.count.on{display:grid}.remote{max-width:580px;margin:100px auto;padding:20px;display:none}.remote button{width:100%;min-height:90px;margin:7px 0;font-size:24px}.remote .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.voice-word{color:var(--acid)}@media(max-width:800px){.grow{display:none}.range input{width:60px}#stage{padding-inline:18px}.bar{max-height:150px;overflow:auto}}
</style></head><body>
<nav class="bar" id="bar"><label class="file">BUKA .MD<input id="file" type="file" accept=".md,text/plain"></label><button id="play">MULAI</button><button id="reset">ULANG</button><button id="countdown">3 DETIK</button><button id="focus">FOKUS</button><button id="voice">VOICE</button><button id="mirror">CERMIN</button><button id="full">FULL</button><span class="grow"></span><label class="range">CEPAT <input id="speed" type="range" min="5" max="120"></label><label class="range">TEKS <input id="size" type="range" min="30" max="110"></label><span id="status" class="status">SIAP</span></nav>
<main id="stage"><article id="content"><p class="hint">Pilih file rekam-*.md<br><br>Spasi: play · V: voice · M: mirror · F: full</p></article></main><section class="remote" id="remote"><h1>REMOTE</h1><button data-cmd="toggle">MULAI / JEDA</button><button data-cmd="voice">VOICE ON / OFF</button><div class="pair"><button data-cmd="up">LEBIH CEPAT</button><button data-cmd="down">LEBIH LAMBAT</button><button data-cmd="back">MUNDUR</button><button data-cmd="next">MAJU</button></div><button data-cmd="reset">ULANG</button></section><div class="focus" id="focusline"></div><div class="count" id="count">3</div><div class="progress" id="progress"></div>
<script>
const $=id=>document.getElementById(id),stage=$('stage'),content=$('content'),play=$('play'),speed=$('speed'),size=$('size'),status=$('status'),isRemote=new URLSearchParams(location.search).has('remote');let running=false,last=0,carry=0,voiceOn=false,recognition,pollAfter=0;
const settings=JSON.parse(localStorage.teleprompter||'{}');speed.value=settings.speed||35;size.value=settings.size||64;document.documentElement.style.setProperty('--size',size.value+'px');if(settings.mirror)stage.classList.add('mirror');if(settings.focus)$('focusline').classList.add('on');function save(){localStorage.teleprompter=JSON.stringify({speed:speed.value,size:size.value,mirror:stage.classList.contains('mirror'),focus:$('focusline').classList.contains('on')})}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>')}function markdown(src){return src.replace(/^---[\s\S]*?---\s*/,'').split('\n').map(s=>{s=s.trim();if(!s)return'';let h=s.match(/^(#{1,3})\s+(.+)/);if(h)return`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;if(s.startsWith('>'))return`<blockquote>${inline(s.slice(1).trim())}</blockquote>`;if(/^[-*]\s/.test(s))return`<p>• ${inline(s.slice(2))}</p>`;if(s.startsWith('|'))return`<p>${inline(s.replaceAll('|',' · '))}</p>`;return`<p>${inline(s)}</p>`}).join('')}
$('file').onchange=async e=>{const f=e.target.files[0];if(f){content.innerHTML=markdown(await f.text());scrollTo(0,0)}};function setRun(v){running=v;play.textContent=v?'JEDA':'MULAI';status.textContent=v?'JALAN':'JEDA';last=performance.now()}function command(cmd,send=true){if(cmd==='toggle')setRun(!running);if(cmd==='reset'){setRun(false);scrollTo({top:0,behavior:'smooth'})}if(cmd==='up')speed.value=Math.min(120,+speed.value+5);if(cmd==='down')speed.value=Math.max(5,+speed.value-5);if(cmd==='next')scrollBy({top:innerHeight*.35,behavior:'smooth'});if(cmd==='back')scrollBy({top:-innerHeight*.35,behavior:'smooth'});if(cmd==='voice'&&!isRemote)voice();save();if(send)fetch('/command',{method:'POST',body:cmd}).catch(()=>{})}
function tick(now){if(running){carry+=(now-last)*(+speed.value/1000);let px=Math.floor(carry);if(px){scrollBy(0,px);carry-=px}}last=now;let max=document.documentElement.scrollHeight-innerHeight;$('progress').style.width=(max?scrollY/max*100:0)+'%';requestAnimationFrame(tick)}requestAnimationFrame(tick);
play.onclick=()=>command('toggle');$('reset').onclick=()=>command('reset');$('mirror').onclick=()=>{stage.classList.toggle('mirror');save()};$('focus').onclick=()=>{$('focusline').classList.toggle('on');save()};$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();speed.oninput=size.oninput=()=>{document.documentElement.style.setProperty('--size',size.value+'px');save()};$('countdown').onclick=()=>{let n=3,c=$('count');c.classList.add('on');c.textContent=n;let t=setInterval(()=>{if(--n){c.textContent=n}else{clearInterval(t);c.classList.remove('on');setRun(true)}},1000)};
function voice(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){status.textContent='VOICE TAK DIDUKUNG';return}if(voiceOn){recognition.stop();voiceOn=false;$('voice').classList.remove('on');return}recognition=new R;recognition.lang='id-ID';recognition.continuous=true;recognition.interimResults=true;recognition.onresult=e=>{let text=e.results[e.results.length-1][0].transcript.toLowerCase(),nodes=[...content.querySelectorAll('p,blockquote,td')],mid=scrollY+innerHeight/2,best=nodes.find(n=>n.offsetTop>mid-200&&n.textContent.toLowerCase().split(/\s+/).some(w=>w.length>4&&text.includes(w)));if(best)scrollTo({top:best.offsetTop-innerHeight*.47,behavior:'smooth'});status.textContent='DENGAR: '+text.slice(-24)};recognition.onend=()=>{if(voiceOn)recognition.start()};recognition.start();voiceOn=true;$('voice').classList.add('on');setRun(false)}$('voice').onclick=voice;
if(isRemote){$('bar').style.display='none';stage.style.display='none';$('remote').style.display='block';document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>fetch('/command',{method:'POST',body:b.dataset.cmd}).catch(()=>{}))}else setInterval(()=>fetch('/state').then(r=>r.json()).then(s=>{if(s.id>pollAfter){pollAfter=s.id;command(s.last,false)}}).catch(()=>{}),500);
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();command('toggle')}if(e.key==='ArrowUp')command('up');if(e.key==='ArrowDown')command('down');if(e.key==='ArrowRight')command('next');if(e.key==='ArrowLeft')command('back');if(e.key.toLowerCase()==='v')voice();if(e.key.toLowerCase()==='m')$('mirror').click();if(e.key.toLowerCase()==='f')$('full').click()});
</script></body></html>
